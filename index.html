<style>
  /* ══════════ Design Tokens ══════════ */
  :root {
    /* Clean white base — subtle cool undertone */
    --bg-root: #f8f9fb;
    --bg-card: rgba(255,255,255,0.68);
    --bg-glass: rgba(255,255,255,0.52);
    --bg-modal: rgba(252,252,254,0.97);

    /* Navy depth */

    --ink-800: #151f30;
    --ink-700: #1c2840;
    --ink-600: #2a3a58;
    --ink-500: #3d4f70;

    /* Gold accent */
    --gold-600: #a88322;
    --gold-500: #c4a03e;
    --gold-400: #d4b65a;
    --gold-300: #e2c878;
    --gold-200: #eeda98;
    --gold-100: #f6eac0;
    --gold-50:  #faf4e0;

    --t-secondary: #5b5e68;
    --t-tertiary:  #9498a4;
    --t-placeholder: #c0c4ce;

    --shadow-card:   0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06);
    --shadow-card-hover: 0 2px 5px rgba(0,0,0,0.05), 0 8px 28px rgba(0,0,0,0.11);
    --shadow-glass: 0 2px 8px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);

    /* Radius */
    --r-3xl: 32px;
    --r-2xl: 24px;
    --r-xl:  20px;
    --r-lg:  16px;
    --r-md:  12px;
    --r-sm:  8px;
    --r-full: 999px;

    /* Spacing scale (8px grid) */
    --sp-1: 8px;
    --sp-2: 16px;
    --sp-3: 24px;
    --sp-4: 32px;
    --sp-5: 40px;
    --sp-6: 48px;
    --sp-7: 56px;
    --sp-8: 64px;
    --sp-9: 80px;
    --sp-10: 120px;

  /* ══════════ Reset & Base ══════════ */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    min-height: 100vh;
    overflow-x: hidden;
    width: 100%;
    max-width: 100vw;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 16px;
    line-height: 1.6;
    letter-spacing: 0.01em;

  /* ══════════ Section Header ══════════ */

    opacity: 1; transform: translateY(0) scale(1);

  /* Card photo */
  .card-photo {

  /* ══════════ Card Rendering ══════════ */
  function renderCards() {
    const grid = document.getElementById('cardGrid');

      const delay = (idx % 4) * 0.05 + Math.floor(idx / 4) * 0.025;

      });
    }, { threshold: 0.06, rootMargin: '0px 0px -24px 0px' });
    document.querySelectorAll('.card').forEach(c => cardObs.observe(c));

    const sh = document.getElementById('sectionHeader');
    if (sh) {
      const obs = new IntersectionObserver(([e]) => {
        if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
      }, { threshold: 0.25 });
      obs.observe(sh);
    }
  }

  /* ══════════ Hero Title Animation ══════════ */
  function buildHeroTitle() {
    const title = document.getElementById('heroTitle');
    const text = '潮起玉苍 · 青税逐浪';
    let html = '';
    for (const ch of text) {
      if (ch === '·') html += '<span class="sep">·</span>';
      else if (ch === ' ') html += '<span style="width:12px;display:inline-block;"></span>';
      else html += '<span class="char">'+ch+'</span>';
    }
    title.innerHTML = html;
  }

  function animateHeroTitle() {
    const chars = document.querySelectorAll('#heroTitle .char');
    chars.forEach((ch, i) => {
      setTimeout(() => ch.classList.add('reveal'), 80 + i * 50);
    });
  }

  function revealStatic() {
    document.getElementById('hero').classList.add('visible');
    setTimeout(animateHeroTitle, 180);
  }

  /* ══════════ Modal ══════════ */
  function openModal(id) {
    const p = people.find(x => x.id === id);
    if (!p) return;
    lastFocusedElement = document.activeElement;
    currentModalId = id;
    if (currentVideo) { currentVideo.pause(); currentVideo.src = ''; currentVideo.load(); }
    renderModalContent(p);
    updateNav();
    document.getElementById('modalOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
    setTimeout(() => {
      const closeBtn = document.querySelector('.modal-close');
      if (closeBtn) closeBtn.focus();
    }, 100);
  }

  function renderModalContent(p) {
    const va = document.getElementById('modalVideoArea');
    if (p.video) {
      // 创建 video：不预设静音。点开卡片属于用户手势，浏览器允许带声音播放
      va.innerHTML = '';
      const v = document.createElement('video');
      v.src = p.video;
      v.poster = p.photo;
      v.controls = true;
      v.playsInline = true;   // iOS 必需，否则拒绝内联播放
      v.preload = 'auto';    // 移动端尽快加载，配合 faststart 立即可播

      va.appendChild(v);
      currentVideo = v;

      const pp = v.play();           // 手势内同步调用，默认带声音
      if (pp !== undefined) {
        pp.catch(() => {             // 极少数浏览器拦截有声播放时，静音兜底保证视频能播
          if (!v.muted) { v.muted = true; v.play().catch(() => {}); }
        });
      }
    } else {
      va.innerHTML = `
        <div class="modal-video-placeholder">
          <div class="play-circle"><svg viewBox="0 0 24 24"><polygon points="7,3 20,12 7,21"/></svg></div>
          <p style="font-size:14px;letter-spacing:1px;">实拍自我介绍 · 30秒以上</p>
          <p style="font-size:11px;margin-top:4px;">视频收集中，敬请期待</p>
        </div>`;
      currentVideo = null;
    }
    document.getElementById('modalBody').innerHTML = `
      <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px;">
        <div class="modal-name">${p.name}</div>
        <div class="modal-position">第 ${p.id} 位 / 共 ${people.length} 位</div>
      </div>
      <div class="modal-meta">
        <div class="modal-meta-item">
          <div class="modal-meta-label">毕业院校</div>
          <div class="modal-meta-value">${p.school}</div>
        </div>
        <div class="modal-meta-item">
          <div class="modal-meta-label">所学专业</div>
          <div class="modal-meta-value">${p.major}</div>
        </div>
        <div class="modal-meta-item">
          <div class="modal-meta-label">兴趣爱好</div>
          <div class="modal-meta-value">${p.tags.join(' / ')}</div>
        </div>
      </div>
      <div class="modal-quote">&ldquo;${p.slogan}&rdquo;</div>
    `;
    document.getElementById('modalDots').innerHTML = people.map(x =>
      '<div class="modal-dot'+ (x.id===p.id?' active':'') +'" onclick="openModal('+x.id+')"></div>'
    ).join('');
  }

  function updateNav() {
    const idx = people.findIndex(x => x.id === currentModalId);
    document.getElementById('modalPrev').style.opacity = idx > 0 ? '1' : '0.12';
    document.getElementById('modalNext').style.opacity = idx < people.length-1 ? '1' : '0.12';
  }

  function navModal(dir) {
    const idx = people.findIndex(x => x.id === currentModalId);
    const next = idx + dir;
    if (next >= 0 && next < people.length) {
      const modal = document.querySelector('.modal');
      modal.style.transition = 'none';
      modal.style.transform = 'translateX('+(dir*36)+'px)';
      modal.style.opacity = '0';
      setTimeout(() => {
        openModal(people[next].id);
        modal.style.transition = 'transform 0.45s cubic-bezier(0.16,1,0.3,1)';
        modal.style.transform = 'scale(1)';
        modal.style.opacity = '1';
      }, 160);
    }
  }

  function closeModal(e) {
    if (e && e.target !== e.currentTarget && !e.target.closest('.modal-close') && !e.target.closest('.modal-nav')) return;
    if (currentVideo) { currentVideo.pause(); currentVideo.src = ''; currentVideo.load(); currentVideo = null; }
    document.getElementById('modalOverlay').classList.remove('active');
    document.body.style.overflow = '';
    currentModalId = null;
    if (lastFocusedElement) { lastFocusedElement.focus(); lastFocusedElement = null; }
  }

  /* ══════════ Keyboard & Touch ══════════ */
  document.addEventListener('keydown', e => {
    if (!currentModalId) return;
    if (e.key === 'Escape') closeModal();
    else if (e.key === 'ArrowLeft') { e.preventDefault(); navModal(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); navModal(1); }
  });

  let touchStartX = 0;
  document.addEventListener('touchstart', e => { if (currentModalId) touchStartX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!currentModalId) return;
    const diff = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(diff) > 60) navModal(diff < 0 ? 1 : -1);
  });

  /* ══════════ Scroll to Top ══════════ */
  window.addEventListener('scroll', () => {
    document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 500);
    const progress = document.getElementById('scrollProgress');
    if (progress) {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = max > 0 ? (window.scrollY / max * 100) + '%' : '0%';
    }
  }, { passive: true });

  /* ══════════ Init ══════════ */
  buildHeroTitle();
  renderCards();
  setTimeout(revealStatic, 140);

  /* Card keyboard accessibility */
  document.getElementById('cardGrid').addEventListener('keydown', e => {
    const card = e.target.closest('.card');
    if (card && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      openModal(parseInt(card.dataset.id));
    }
  });
</script>
</body>
</html>
